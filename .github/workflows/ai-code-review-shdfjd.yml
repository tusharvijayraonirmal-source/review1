name: AI Full Code Review - shdfjd

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to review"
        required: true
        default: "main"
        type: string
      review_type:
        description: "Review type"
        required: true
        default: "full"
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  ai-full-code-review:
    runs-on:
      - self-hosted
      - linux
      - x64
      

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{inputs.branch }}

      - name: Debug checkout
        shell: bash
        run: |
          set -e

          echo "Full code review started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: ${{inputs.branch}}"
          echo "Commit:"
          git rev-parse HEAD

      - name: Setup Python virtual environment
        shell: bash
        run: |
          set -e

          python3 --version

          rm -rf .venv

          python3 -m venv .venv

          .venv/bin/python --version

          .venv/bin/python -m pip install --upgrade pip

      - name: Install dependencies
        shell: bash
        run: |
          set -e

          if [ ! -f requirements.txt ]; then
            echo "ERROR: requirements.txt not found"
            exit 1
          fi

          .venv/bin/python -m pip install -r requirements.txt

      - name: Generate full code input
        shell: bash
        run: |
          set -e

          echo "Generating full code input..."

          git ls-files             ':(exclude).git/*'             ':(exclude).venv/*'             ':(exclude)__pycache__/*'             ':(exclude)node_modules/*'             ':(exclude)review_result.json'             ':(exclude)full_code.txt'             ':(exclude)tracked_files.txt'             ':(exclude).github/workflows/*'             > tracked_files.txt

          : > full_code.txt

          while IFS= read -r file; do
            if [ -f "$file" ]; then
              echo "" >> full_code.txt
              echo "======================================" >> full_code.txt
              echo "FILE: $file" >> full_code.txt
              echo "======================================" >> full_code.txt
              cat "$file" >> full_code.txt
            fi
          done < tracked_files.txt

          echo "Tracked files:"
          wc -l tracked_files.txt

          echo "Full code lines:"
          wc -l full_code.txt

          if [ ! -s full_code.txt ]; then
            echo "ERROR: full_code.txt is empty"
            exit 1
          fi

      - name: Validate Claude configuration
        shell: bash
        env:
          ANTHROPIC_AUTH_TOKEN: ${ secrets.ANTHROPIC_AUTH_TOKEN }
          ANTHROPIC_BASE_URL: ${ vars.ANTHROPIC_BASE_URL }
          ANTHROPIC_MODEL: ${ vars.ANTHROPIC_MODEL }
        run: |
          set -e

          if [ -z "$ANTHROPIC_AUTH_TOKEN" ]; then
            echo "ERROR: ANTHROPIC_AUTH_TOKEN is missing"
            exit 1
          fi

          if [ -z "$ANTHROPIC_BASE_URL" ]; then
            echo "ERROR: ANTHROPIC_BASE_URL is missing"
            exit 1
          fi

          if [ -z "$ANTHROPIC_MODEL" ]; then
            echo "ERROR: ANTHROPIC_MODEL is missing"
            exit 1
          fi

          echo "Claude configuration is valid"
          echo "Claude base URL: $ANTHROPIC_BASE_URL"
          echo "Claude model: $ANTHROPIC_MODEL"

      - name: Run full AI code review
        shell: bash
        env:
          API_URL: ${{ vars.BACKEND_URL }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ vars.ANTHROPIC_BASE_URL }}
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          REVIEW_MODE: FULL_CODEBASE
          REVIEW_SKILLS: "code-review,security-review"
          CLAUDE_MODEL: "claude-sonnet-5"
          REPOSITORY: ${{ github.repository }}
          REVIEW_BRANCH: ${{ inputs.branch }}
        run: |
          set -e

          echo "Starting full AI code review"
          echo "Repository: $REPOSITORY"
          echo "Review mode: $REVIEW_MODE"
          echo "Review branch: $REVIEW_BRANCH"
          echo "Claude model: $CLAUDE_MODEL"

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/ai_code_review.py"             --diff "$GITHUB_WORKSPACE/full_code.txt"             --pr-number "0"             --repository "$REPOSITORY"             --review-mode "$REVIEW_MODE"             --skills "$REVIEW_SKILLS"             --repository-context "$REVIEW_BRANCH"

      - name: Validate review result
        shell: bash
        run: |
          set -e

          if [ ! -s review_result.json ]; then
            echo "ERROR: review_result.json is missing or empty"
            exit 1
          fi

          .venv/bin/python             -m json.tool             review_result.json             > /dev/null

          echo "Review result is valid"

      - name: Upload full review report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-code-review-report
          path: |
            review_result.json
            full_code.txt
          if-no-files-found: warn

      - name: Send reviewer notification
        if: always()
        shell: bash
        env:
          SMTP_HOST: ${{ vars.SMTP_HOST }}
          SMTP_PORT: ${{ vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          REVIEWER_EMAIL: ${{ vars.REVIEWER_EMAIL }}
        run: |
          if [ ! -s review_result.json ]; then
            echo "No review result found; skipping email"
            exit 0
          fi

          .venv/bin/python             "$GITHUB_WORKSPACE/scripts/send_review_email.py"             --review-file review_result.json             --pr-number "0"             --repository "$GITHUB_REPOSITORY"

        